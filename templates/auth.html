{% extends 'base.html' %}
{% block title %}Inloggen — IPTV Downloader{% endblock %}
{% block content %}
<div class="login-wrap" style="max-width:380px">
  <h1 style="margin-bottom:1.2rem">Inloggen</h1>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <div class="card">
    <form method="POST">
      <div class="form-group">
        <label for="p">Wachtwoord</label>
        <input type="password" id="p" name="password" autofocus required autocomplete="current-password">
      </div>
      <button class="btn btn-primary" style="width:100%">Inloggen</button>
    </form>
  </div>
</div>
{% endblock %}
